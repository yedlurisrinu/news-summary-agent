# works for both local, docker same now part of /etc/hosts file
ELASTIC_URL: "http://elasticsearch:9200" 
request_timeout: 60
retry_on_timeout: True
max_retries: 3
http_compress: True
# Connection pooling for cloud
connections_per_node: 10

# works for both local, docker same now part of /etc/hosts file
PG_HOST: "postgres"
PG_PORT: 5432

ES_INDEX: news_articles
CATEGORY_QUERY: 
  size: 0
  query:
    bool:
      should: []                 # filled in code, one match clause per category
      minimum_should_match: 1
  aggs:
    matched_sources:
      terms:
        field: source.keyword
        size: 20

# Build an ES query that:
      # - Uses semantic search on the `content.semantic` field (semantic_text). TODO this part is not complete yet
      # - Boosts documents whose title matches any of the extracted categories.
SEARCH_QUERY_TEMPLATE:
  size: 5
  _source: [article_id]
  query:
    bool:
      must:
        - multi_match:
            query: ""             # filled in code: user query
            fields: ["title^2", "content"]
            minimum_should_match: "2<75%"
      should:
        - multi_match:
            query: ""             # filled in code: expanded category terms
            fields: [title]
            boost: 1.5

MCP_URL: "http://es-mcp-lb:9599/mcp"
ALLOWED_ISSUER_URL: "http://keycloak:8180/realms/es-mcp"
BFF_BASE_URL: "http://news-summary-app:8007"
MCP_WELL_KNOWN_URI: "/.well-known/oauth-protected-resource"
CIMD_CLIENT_ID: "https://news-cimd-host/clients/news-summary-app-cimd.json"
SESSION_MAX_AGE_SEC: 36000
AS_WELL_KNOWN_URL: "/.well-known/openid-configuration"
APP_VAULT_CONFIG_PATH: NEWS-SUMMARY-APP/CONFIG
APP_VAULT_SESSIONS_PATH: NEWS-SUMMARY-APP/SESSIONS