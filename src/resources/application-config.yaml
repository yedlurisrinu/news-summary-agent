# works for both local, docker same now part of /etc/hosts file
PG_HOST: "postgres"
PG_PORT: 5432
PG_POOL_MIN_SIZE: 1
PG_POOL_MAX_SIZE: 10

LLM_MODEL: "openai:gpt-4o-mini"
LLM_TEMPERATURE: 0.0
LLM_TIMEOUT_SEC: 10

# per-article content cap for the summary prompt (es-mcp-server also truncates)
SUMMARY_CONTENT_MAX_CHARS: 1000

MCP_URL: "http://es-mcp-lb:9599/mcp"
# MCP protocol version es-mcp-server speaks (mcp 2.3.0); pinning skips the per-connection probe
MCP_PROTOCOL_VERSION: "2026-07-28"
ALLOWED_ISSUER_URL: "http://keycloak:8180/realms/es-mcp"
BFF_BASE_URL: "http://news-summary-app:8007"
MCP_WELL_KNOWN_URI: "/.well-known/oauth-protected-resource"
CIMD_CLIENT_ID: "https://news-cimd-host/clients/news-summary-app-cimd.json"
SESSION_MAX_AGE_SEC: 36000
AS_WELL_KNOWN_URL: "/.well-known/openid-configuration"
APP_VAULT_SESSIONS_PATH: NEWS-SUMMARY-APP/SESSIONS
# Stored sessions not updated for this long are deleted (must exceed Keycloak's SSO session max,
# 36000 s, so a refreshable session is never removed); swept at start-up, then every 24 h.
SESSION_STORE_MAX_AGE_SEC: 39600
SESSION_SWEEP_INTERVAL_SEC: 86400
SERVICE_CLIENT_ID: news-summary-app-svc
SERVICE_TOKEN_LEEWAY_SEC: 60
