[pytest]
testpaths = tests
# src: the app packages; .: the evals package (tests/trajectory imports evals.trajectory.harness)
pythonpath = src .
python_files = *_test.py
python_classes = Test*
python_functions = test_*
# coverage on every run (local and CI): settings and the 90% gate are in pyproject.toml [tool.coverage]
addopts = --cov --cov-report=term-missing
