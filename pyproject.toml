[project]
name = "news-summary-agent"
version = "0.1.0"
description = "News summary workflow (FastAPI + LangGraph) behind a Keycloak BFF login; searches articles through es-mcp-server"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.162.0",
    "hvac==2.4.0",
    "langchain==1.4.3",
    "langchain-core==1.6.3",
    "langchain-openai==1.6.2",
    "langgraph==1.2.12",
    "langgraph-checkpoint-postgres==3.1.2",
    "psycopg[binary,pool]==3.3.6",
    "pydantic==2.12.0",
    "uvicorn[standard]==0.54.0",
    "itsdangerous==2.2.0",
    "fastmcp==4.1.4",
    "authlib==1.9.1",
    "httpx2==2.13.1",
    "mcp-types==2.3.0",
    "pyyaml==6.0.3",
    "starlette==1.10.0",
]

[dependency-groups]
dev = [
    "mypy==2.4.0",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.8",
    "types-pyyaml==6.0.12.20261103",
]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
explicit_package_bases = true
namespace_packages = true
warn_unused_ignores = true

# Untyped third-party packages only (no py.typed, no stub package).
# Never set ignore_missing_imports globally: it hides missing first-party modules.
[[tool.mypy.overrides]]
module = ["hvac", "hvac.*", "authlib.*"]
ignore_missing_imports = true

[tool.uv]
package = true

[tool.ruff]
# No rule selection: the rules are ruff's defaults for the pinned version (ruff==0.16.8 in the dev
# group), so they only change when that pin is bumped.
target-version = "py312"
src = ["src", "tests"]

[tool.coverage.run]
source = ["src"]
branch = false

[tool.coverage.report]
# src/ has no __init__.py files: without this, modules no test imports are left out of the report
include_namespace_packages = true
show_missing = true
skip_empty = true
fail_under = 90
exclude_also = [
    'if __name__ == .__main__.:',
    '^\s*\.\.\.\s*$',
]
