<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>News Summary — Sign in</title>
  <style>
    :root { color-scheme: light dark; --bg:#f6f7f9; --card:#fff; --ink:#1d2330; --muted:#5b6475; --accent:#2f5bea; --err:#b42318; }
    @media (prefers-color-scheme: dark) { :root { --bg:#14171c; --card:#1d2129; --ink:#e8ebf0; --muted:#9aa3b2; --accent:#7c9cff; --err:#ff8a80; } }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--ink);
           font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding:16px; }
    main { width:100%; max-width:380px; background:var(--card); border-radius:12px; padding:32px 28px;
           box-shadow:0 1px 3px rgba(0,0,0,.12); text-align:center; }
    h1 { font-size:22px; margin:0 0 8px; }
    p  { color:var(--muted); margin:0 0 24px; }
    a.button { display:inline-block; width:100%; padding:12px 16px; border-radius:8px; background:var(--accent);
               color:#fff; text-decoration:none; font-weight:600; }
    a.button:focus-visible { outline:3px solid var(--ink); outline-offset:2px; }
    #error { color:var(--err); margin:16px 0 0; min-height:1.5em; }
  </style>
</head>
<body>
  <main>
    <h1>News Summary</h1>
    <p>Sign in to search and summarise the news.</p>
    <a class="button" href="/auth/login">Log in with Keycloak</a>
    <p id="error" role="alert"></p>
  </main>
  <script>
    // Show a short message when the callback sent us back with ?error=...
    const messages = {
      access_denied: "Sign-in was cancelled.",
      session_expired: "Your session has ended. Please sign in again.",
      state_mismatch: "Sign-in could not be verified. Please try again.",
      login_failed: "Sign-in failed. Please try again.",
      auth_unavailable: "Sign-in is temporarily unavailable. Please try again in a moment."
    };
    const code = new URLSearchParams(location.search).get("error");
    if (code) {
      // textContent (not innerHTML) so nothing from the URL is ever run as HTML
      document.getElementById("error").textContent = messages[code] || messages.login_failed;
    }
  </script>
</body>
</html>
